<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bulletproof Scaling KB</title>
<script>(()=>{const t=localStorage.getItem('bps-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=t})()</script>
<style>
:root,[data-theme=light]{--bg:#f6f8fc;--panel:#fff;--hover:#eef1f6;--sel:#e8f0fe;--ln:#e6e8eb;--fg:#1f1f1f;--mu:#5f6368;--ac:#0b57d0;--acbg:#d3e3fd;--chip:#f1f3f4;--warn:#b3261e;--warnbg:#fce8e6;--gold:#b06000;--goldbg:#fef7e0;--ok:#188038;--sh:0 1px 2px rgba(60,64,67,.15)}
[data-theme=dark]{--bg:#0f1115;--panel:#1b1e23;--hover:#262a31;--sel:#24324a;--ln:#2c3038;--fg:#e8eaed;--mu:#9aa0a6;--ac:#8ab4f8;--acbg:#2a3a57;--chip:#272b32;--warn:#f28b82;--warnbg:#3a2321;--gold:#fdd663;--goldbg:#3a3220;--ok:#81c995;--sh:none}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.5 "Google Sans",Roboto,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
body{display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.top{height:60px;flex:none;display:flex;align-items:center;gap:10px;padding:0 12px}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:18px;color:var(--mu);flex:none}
.ib:hover{background:var(--hover)}
.brand{display:flex;align-items:center;gap:8px;font-size:19px;font-weight:500;min-width:200px;white-space:nowrap}
.logo{width:30px;height:30px;border-radius:8px;background:var(--ac);color:var(--panel);display:grid;place-items:center;font-weight:700;font-size:15px}
.search{flex:1;max-width:720px;height:46px;border-radius:24px;background:var(--hover);display:flex;align-items:center;gap:8px;padding:0 6px 0 16px}
.search:focus-within{background:var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--fg);font-size:16px}
.sp{flex:1}
.app{flex:1;min-height:0;display:grid;grid-template-columns:232px minmax(320px,420px) 1fr;gap:12px;padding:0 14px 14px 0}
.side{overflow:auto;padding:4px 0 20px}
.nav{display:flex;align-items:center;gap:12px;height:34px;padding:0 14px 0 26px;border-radius:0 17px 17px 0;cursor:pointer;color:var(--fg);white-space:nowrap}
.nav:hover{background:var(--hover)}
.nav.on{background:var(--acbg);font-weight:600}
.nav .ic{width:18px;text-align:center;color:var(--mu)}
.nav .nm{flex:1;overflow:hidden;text-overflow:ellipsis}
.nav .ct{font-size:12px;color:var(--mu)}
.grp{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--mu);padding:16px 26px 4px}
.pane{background:var(--panel);border-radius:16px;overflow:auto;box-shadow:var(--sh);min-height:0}
.lh{position:sticky;top:0;z-index:2;background:var(--panel);padding:12px 16px 8px;border-bottom:1px solid var(--ln)}
.lh h2{margin:0;font-size:16px;font-weight:600;display:flex;align-items:center;gap:6px}
.lh .d{color:var(--mu);font-size:12.5px;margin-top:2px}
.seg{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.seg button{border:1px solid var(--ln);border-radius:8px;padding:3px 10px;font-size:12.5px;color:var(--mu)}
.seg button.on{background:var(--acbg);border-color:transparent;color:var(--fg);font-weight:600}
.it{display:grid;grid-template-columns:14px 1fr auto;gap:2px 10px;padding:10px 16px;border-bottom:1px solid var(--ln);cursor:pointer}
.it:hover{background:var(--hover);box-shadow:inset 1px 0 var(--ln),inset -1px 0 var(--ln),0 1px 2px rgba(60,64,67,.2)}
.it.on{background:var(--sel)}
.it .bj{grid-row:1/3;margin-top:6px;width:8px;height:8px;border-radius:50%}
.it .bj.y{background:var(--warn)}
.it .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .dt{font-size:12px;color:var(--mu);white-space:nowrap}
.it .s{grid-column:2/4;color:var(--mu);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.it .lb{display:inline-block;font-size:11px;background:var(--chip);color:var(--mu);border-radius:4px;padding:0 6px;margin-right:6px;vertical-align:1px}
.read{padding:0}
.rh{position:sticky;top:0;z-index:2;background:var(--panel);display:flex;align-items:center;gap:4px;padding:8px 12px;border-bottom:1px solid var(--ln)}
.rb{padding:18px 28px 60px;max-width:820px}
.crumb{font-size:12.5px;color:var(--mu)}
.crumb a{color:var(--ac);cursor:pointer}
h1{font-size:22px;font-weight:500;margin:4px 0 10px;line-height:1.3}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.chip{background:var(--chip);border-radius:6px;padding:2px 8px;font-size:12px;color:var(--mu)}
.chip.g{background:var(--goldbg);color:var(--gold);font-weight:600}
.tldr{font-size:16px;line-height:1.5;margin:0 0 16px}
h3{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--mu);margin:22px 0 8px}
ul.pts{margin:0;padding-left:20px}ul.pts li{margin:5px 0}
.co{border-radius:10px;padding:10px 14px;margin:12px 0;font-size:14px}
.co b{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;margin-bottom:2px}
.co.w{background:var(--warnbg)}.co.w b{color:var(--warn)}
.co.g{background:var(--goldbg)}.co.g b{color:var(--gold)}
details{border:1px solid var(--ln);border-radius:10px;padding:8px 14px;margin:16px 0}
summary{cursor:pointer;color:var(--ac);font-weight:500}
details p{margin:8px 0 2px}
.ev{border:1px solid var(--ln);border-radius:10px;margin:8px 0;overflow:hidden}
.evh{padding:10px 14px;cursor:pointer}
.evh:hover{background:var(--hover)}
.evt{font-weight:600}
.evm{font-size:12px;color:var(--mu)}
.evb{padding:0 14px 12px}
.q{border-left:3px solid var(--ln);padding-left:10px;color:var(--mu);font-style:italic;margin:8px 0}
.lnk{color:var(--ac);font-size:13px;font-weight:500;margin-right:14px;padding:4px 0}
.src{font-size:12.5px;background:var(--bg);border-radius:8px;padding:8px 10px;margin:6px 0;white-space:pre-wrap;word-break:break-word}
.rel{border:1px solid var(--ln);border-radius:10px;overflow:hidden}.rel .it:last-child{border-bottom:0}
.tags{margin-top:20px}.tag{display:inline-block;font-size:11.5px;color:var(--mu);border:1px solid var(--ln);border-radius:12px;padding:1px 9px;margin:0 4px 4px 0}
.empty{display:grid;place-items:center;height:100%;text-align:center;color:var(--mu);padding:30px}
.empty .big{font-size:44px;margin-bottom:6px}
.stat{display:flex;gap:22px;justify-content:center;margin:14px 0}
.stat b{display:block;font-size:22px;color:var(--fg);font-weight:500}
.kbd{font-size:12px;margin-top:18px}
kbd{border:1px solid var(--ln);border-radius:4px;padding:0 5px;font-family:inherit;font-size:11px}
mark{background:var(--goldbg);color:inherit;border-radius:2px;box-shadow:0 0 0 1px var(--goldbg)}
.hide{display:none!important}
.mob{display:none}
.scrim{display:none}
@media(max-width:1100px){
 .app{grid-template-columns:minmax(300px,380px) 1fr;padding-left:14px}
 .side{position:fixed;z-index:20;top:0;bottom:0;left:0;width:270px;background:var(--panel);transform:translateX(-100%);transition:transform .2s;padding-top:14px;box-shadow:0 0 20px rgba(0,0,0,.25)}
 body.drawer .side{transform:none}
 body.drawer .scrim{display:block;position:fixed;inset:0;z-index:19;background:rgba(0,0,0,.35)}
 .menu{display:grid!important}
 .brand{min-width:0}
}
@media(max-width:720px){
 .app{grid-template-columns:1fr;padding:0;gap:0}
 .pane{border-radius:0;box-shadow:none}
 body.reading .list{display:none}
 body:not(.reading) .read{display:none}
 .mob{display:grid}
 .brand span{display:none}
 .rb{padding:14px 18px 60px}
 .top{gap:6px;padding:0 8px}
}
</style></head><body>
<header class="top">
 <button class="ib menu hide" onclick="document.body.classList.toggle('drawer')" title="Menu">☰</button>
 <div class="brand"><div class="logo">B</div><span>Bulletproof KB</span></div>
 <label class="search"><span style="color:var(--mu)">⌕</span><input id="q" type="search" placeholder="Search themes and nuggets" autocomplete="off"><button class="ib hide" id="qx" onclick="clearQ()" title="Clear">✕</button></label>
 <button class="ib" id="tg" onclick="flip()" title="Light / dark"></button>
</header>
<div id="gate" style="position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:20px">
 <form onsubmit="event.preventDefault();el('gerr').textContent='Unlocking…';unlock(el('gp').value)" style="background:var(--panel);box-shadow:var(--sh);border-radius:16px;padding:28px;width:100%;max-width:340px;text-align:center">
 <div class="logo" style="margin:0 auto 12px;width:44px;height:44px;font-size:20px">B</div><div style="font-size:18px;font-weight:500;margin-bottom:4px">Bulletproof KB</div>
 <div style="color:var(--mu);font-size:13px;margin-bottom:16px">Members only. Enter the password.</div>
 <input id="gp" type="password" autocomplete="current-password" style="width:100%;height:44px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--fg);padding:0 12px;font-size:16px;outline:0">
 <button style="width:100%;height:42px;margin-top:10px;border-radius:10px;background:var(--ac);color:var(--panel);font-weight:600">Open</button>
 <div id="gerr" style="color:var(--warn);font-size:13px;min-height:20px;margin-top:8px"></div></form></div>
<div class="scrim" onclick="document.body.classList.remove('drawer')"></div>
<div class="app">
 <nav class="side" id="side"></nav>
 <section class="pane list" id="list"></section>
 <section class="pane read" id="read"></section>
</div>
<script>
let C,NG=null,SRC=null,S={},LIST=[];
const el=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmt=d=>d?`${M[+d.slice(5,7)-1]} ’${d.slice(2,4)}`:'';
const K=['f','t','th','n','q','s','k'];
function P(){const p=new URLSearchParams(location.search),o={};for(const k of K)o[k]=p.get(k)||'';return o}
function nav(ch,push=true){S={...S,...ch};const p=new URLSearchParams();for(const k of K)if(S[k])p.set(k,S[k]);
 history[push?'pushState':'replaceState'](null,'',location.pathname+(p.toString()?'?'+p:''));document.body.classList.remove('drawer');render()}
addEventListener('popstate',()=>{S=P();render()});
function flip(){const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;localStorage.setItem('bps-theme',t);tgI()}
function tgI(){el('tg').textContent=document.documentElement.dataset.theme==='dark'?'☀':'☾'}
const W=()=>(S.q||'').toLowerCase().split(/\s+/).filter(w=>w.length>1);
function hl(s){s=esc(s);const w=W().map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));return w.length?s.replace(new RegExp('('+w.join('|')+')','gi'),'<mark>$1</mark>'):s}
function sc(txt){const s=txt.toLowerCase(),w=W();if(!w.length)return 0;for(const x of w)if(!s.includes(x))return 0;return 1}
const TP=id=>C.topics.find(t=>t.id===id),TH=id=>C.themes.find(t=>t.id===id);
const thTxt=t=>[t.name,t.tldr,t.tags.join(' '),t.points.join(' '),t.debate,t.summary].join(' ');
const nTxt=n=>[n.ti,n.x,n.q,n.a.join(' ')].join(' ');
async function loadN(){if(!NG)NG=await getJSON('nuggets');return NG}
async function loadS(){if(!SRC)SRC=await getJSON('src');return SRC}

function side(){const all=C.themes.length,db=C.themes.filter(t=>t.debate).length;
 const on=(f,t)=>!S.q&&((t&&S.t===t)||(!t&&!S.t&&(S.f||'all')===f));
 const it=(click,ic,nm,ct,a)=>`<div class="nav ${a?'on':''}" onclick="${click}"><span class="ic">${ic}</span><span class="nm">${esc(nm)}</span><span class="ct">${ct}</span></div>`;
 let h=it("nav({f:'',t:'',th:'',n:'',q:'',k:''})",'▤','All themes',all,on('all'))+it("nav({f:'db',t:'',th:'',n:'',q:'',k:''})",'⚔','Debated',db,on('db'));
 for(const g of C.groups){h+=`<div class="grp">${esc(g.name)}</div>`;for(const id of g.topics){const t=TP(id);h+=it(`nav({t:'${id}',f:'',th:'',n:'',q:'',k:''})`,'•',t.label,t.nt,on('',id))}}
 el('side').innerHTML=h}

function listThemes(){let L=C.themes.slice();
 if(S.q)L=L.filter(t=>sc(thTxt(t)));else if(S.t)L=L.filter(t=>t.topic===S.t);else if(S.f==='db')L=L.filter(t=>t.debate);
 const s=S.s||'top';L.sort(s==='new'?(a,b)=>b.last.localeCompare(a.last):s==='hot'?(a,b)=>b.sig-a.sig:(a,b)=>b.score-a.score);return L}
function row(t){const tp=TP(t.topic);return `<div class="it ${S.th===t.id?'on':''}" id="i-${t.id}" onclick="nav({th:'${t.id}',n:''})"><span class="bj ${t.debate?'y':''}" title="${t.debate?'Debated':''}"></span>
 <span class="t">${hl(t.name)}</span><span class="dt">${fmt(t.last)}</span><span class="s">${S.t?'':`<span class="lb">${esc(tp.label)}</span>`}${hl(t.tldr)}</span></div>`}
function nrow(i,n){return `<div class="it ${S.n===i?'on':''}" id="i-${i}" onclick="nav({n:'${i}',th:''})"><span class="bj"></span><span class="t">${hl(n.ti)}</span><span class="dt">${fmt(n.d)}</span><span class="s">${hl(n.x)}</span></div>`}
let lseq=0;
async function list(){const L=el('list'),y=L.scrollTop,my=++lseq;const s=S.s||'top';
 let title,desc='';
 if(S.q){title=`Search: “${esc(S.q)}”`}else if(S.t){const t=TP(S.t);title=esc(t.label);desc=esc(t.tldr)}else title=S.f==='db'?'Debated':'All themes';
 const T=listThemes();let tabs='';
 const sortBtns=['top','Top','new','Newest','hot','Most reacted'];
 const seg=`<div class="seg">${[0,2,4].map(k=>`<button class="${s===sortBtns[k]?'on':''}" onclick="nav({s:'${sortBtns[k]==='top'?'':sortBtns[k]}'},false)">${sortBtns[k+1]}</button>`).join('')}</div>`;
 if(S.q)tabs=`<div class="seg"><button class="${S.k!=='ng'?'on':''}" onclick="nav({k:''},false)">Themes ${T.length}</button><button class="${S.k==='ng'?'on':''}" id="ngtab" onclick="nav({k:'ng'},false)">Nuggets …</button></div>`;
 const head=`<div class="lh"><h2>${title}</h2>${desc?`<div class="d">${desc}</div>`:''}${tabs}${S.k==='ng'?'':seg}</div>`;
 if(S.k==='ng'&&S.q){L.innerHTML=head+'<div class="empty">Searching…</div>';const N=await loadN();if(my!==lseq)return;
  const R=Object.entries(N).filter(([i,n])=>sc(nTxt(n))).sort((a,b)=>b[1].s-a[1].s);LIST=R.slice(0,200).map(x=>x[0]);
  L.innerHTML=head+(R.slice(0,200).map(([i,n])=>nrow(i,n)).join('')||'<div class="empty">No nuggets match.</div>');el('ngtab').textContent=`Nuggets ${R.length}`;}
 else{LIST=T.map(t=>t.id);L.innerHTML=head+(T.map(row).join('')||'<div class="empty">No themes match.</div>');
  if(S.q)loadN().then(N=>{if(my!==lseq)return;const c=Object.values(N).filter(n=>sc(nTxt(n))).length;const b=el('ngtab');if(b)b.textContent=`Nuggets ${c}`})}
 L.scrollTop=y}

const STOP=new Set('the a an and or of to in on for with is are be it its this that as at by from your you if not but use than then into more most less over under via per vs can will just only when what how why their they them who all any each one two new old get got make made does do did has have had was were been so too very also about after before after'.split(' '));
const VEC={};
function vec(t){if(VEC[t.id])return VEC[t.id];const v={};const add=(s,w)=>{for(const x of String(s).toLowerCase().split(/[^a-z0-9$%]+/))if(x.length>2&&!STOP.has(x))v[x]=(v[x]||0)+w};
 t.tags.forEach(g=>{add(g,3);v['#'+g]=(v['#'+g]||0)+4});add(t.name,2);add(t.tldr,1);t.points.forEach(p=>add(p,1));return VEC[t.id]=v}
function related(t,k=6){const a=vec(t),na=Math.sqrt(Object.values(a).reduce((s,x)=>s+x*x,0))||1;
 return C.themes.filter(o=>o.id!==t.id&&o.score>=0).map(o=>{const b=vec(o);let d=0;for(const w in a)if(b[w])d+=a[w]*b[w];const nb=Math.sqrt(Object.values(b).reduce((s,x)=>s+x*x,0))||1;return[o,d/(na*nb)+(o.topic===t.topic?0.03:0)]})
 .filter(x=>x[1]>0.05).sort((x,y)=>y[1]-x[1]).slice(0,k).map(x=>x[0])}
function back(){nav({th:'',n:''})}
const bar=extra=>`<div class="rh"><button class="ib mob" onclick="back()" title="Back">←</button><div class="sp"></div>${extra||''}</div>`;
async function copyLink(){const b=el('cp');let ok=false;try{if(navigator.clipboard&&isSecureContext){await navigator.clipboard.writeText(location.href);ok=true}}catch(e){}
 if(!ok){const t=document.createElement('textarea');t.value=location.href;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();try{ok=document.execCommand('copy')}catch(e){}t.remove()}
 if(!ok){prompt('Copy this link:',location.href);return}if(b){b.textContent='✓';setTimeout(()=>b.textContent='⧉',1200)}}
const tools=`<button class="ib" id="cp" onclick="copyLink()" title="Copy link">⧉</button>`;
function evHTML(i,n,open){return `<div class="ev"><div class="evh" onclick="this.nextElementSibling.classList.toggle('hide')"><div class="evt">${hl(n.ti)}</div><div class="evm">${fmt(n.d)} · ${esc(n.a.slice(0,3).join(', '))}${n.a.length>3?' +'+(n.a.length-3):''}${n.s?' · ★'+n.s:''}</div></div>
 <div class="evb ${open?'':'hide'}"><div>${hl(n.x)}</div>${n.q?`<div class="q">“${hl(n.q)}”</div>`:''}<button class="lnk" onclick="srcs('${i}',this)">Original messages (${n.m.length})</button><button class="lnk" onclick="nav({n:'${i}',th:''})">Open</button></div></div>`}
async function srcs(i,b){b.textContent='Loading…';const[N,X]=await Promise.all([loadN(),loadS()]);
 b.outerHTML=N[i].m.map(k=>{const s=X[k];return s?`<div class="src"><b>#${k}</b> · ${esc(s[0])} · <b>${esc(s[1])}</b>\n${hl(s[2])}</div>`:''}).join('')}
let rseq=0;
async function read(){const R=el('read'),my=++rseq;R.scrollTop=0;
 if(S.th&&TH(S.th)){const t=TH(S.th),tp=TP(t.topic);
  R.innerHTML=bar(tools)+`<div class="rb"><div class="crumb"><a onclick="nav({t:'${t.topic}',f:'',q:'',k:''})">${esc(tp.label)}</a></div><h1>${hl(t.name)}</h1>
  <div class="chips"><span class="chip">${t.n} nuggets</span><span class="chip">${t.people} people</span><span class="chip">★ ${t.sig} reactions</span><span class="chip">${fmt(t.first)} – ${fmt(t.last)}</span></div>
  <p class="tldr">${hl(t.tldr)}</p>${t.points.length?`<h3>Key points</h3><ul class="pts">${t.points.map(p=>`<li>${hl(p)}</li>`).join('')}</ul>`:''}
  ${t.debate?`<div class="co w"><b>Debated</b>${hl(t.debate)}</div>`:''}
  <details><summary>Full summary</summary><p>${hl(t.summary)}</p></details>
  <h3>Related themes</h3><div class="rel">${related(t).map(r=>{const rp=TP(r.topic);return `<div class="it" onclick="nav({th:'${r.id}',n:''})"><span class="bj ${r.debate?'y':''}"></span><span class="t">${esc(r.name)}</span><span class="dt">${esc(rp.label)}</span><span class="s">${esc(r.tldr)}</span></div>`}).join('')}</div>
  <h3>Evidence · ${t.n} nuggets</h3><div id="ev"><div class="evm">Loading…</div></div>
  <div class="tags">${t.tags.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div></div>`;
  const N=await loadN();if(my!==rseq)return;const L=t.ids.map(i=>[i,N[i]]).filter(x=>x[1]).sort((a,b)=>b[1].s-a[1].s);
  el('ev').innerHTML=L.map(([i,n])=>evHTML(i,n)).join('');return}
 if(S.n){R.innerHTML=bar()+'<div class="rb evm">Loading…</div>';const N=await loadN();if(my!==rseq)return;const n=N[S.n];
  if(!n){R.innerHTML=bar()+'<div class="empty">Nugget not found.</div>';return}
  const t=C.themes.find(x=>x.ids.includes(S.n));
